<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetVerse · Register</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Moon+Dance&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="canvas"></canvas>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="grid-overlay"></div>

    <nav>
        <a class="logo" href="index.html">
            <div class="logo-icon">M</div>
            <span class="logo-text">Meet<span>Verse</span></span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html#features">Features</a></li>
            <li><a href="index.html#meetings">Meetings</a></li>
            <li><a href="index.html#database">Database</a></li>
        </ul>
        <div class="nav-actions">
            <button class="btn-ghost" onclick="location.href='login.html'">Sign In</button>
            <button class="btn-primary" onclick="location.href='register.html'">Get Started</button>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Create an <em
                        style="font-style:normal;background:linear-gradient(135deg,#60a5fa,#93c5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Account</em>
                </h2>
                <p>Join your team on MeetVerse.</p>
            </div>


            <form action="register.php" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" name="first_name" placeholder="First Name" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" name="last_name" placeholder="Last Name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Work Email</label>
                    <input type="email" name="email" placeholder="name@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" name="department" placeholder="e.g. Engineering" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Password" minlength="8" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" placeholder="Confirm Password" required>
                </div>
                <div id="error-msg" style="color: rgba(255, 0, 0, 0.558); display: none; margin-bottom: 1rem; font-size: 0.83rem;"></div>
                <button type="submit" class="btn-auth">Create Account</button>
            </form>

            <p class="terms-note">By registering you agree to our <a href="#">Terms</a> and <a href="#">Privacy
                    Policy</a>.</p>
            <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        if (error) {
            const box = document.getElementById('error-msg');
            box.textContent = error;
            box.style.display = 'block';
        }
    </script>
</body>

</html>
